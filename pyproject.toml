[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mcnavigill"
version = "0.2.0"
description = "Winter routing across McGill's engineering quarter: shortest, warmest and Pareto-optimal routes."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jonason Lin" }]
dependencies = ["folium>=0.14", "requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.6"]

[project.scripts]
mcnavigill = "mcnavigill.cli:main"

[tool.setuptools]
packages = ["mcnavigill"]

[tool.setuptools.package-data]
mcnavigill = ["data/*.csv"]
